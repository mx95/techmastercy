# Issue Let's Encrypt certs and switch nginx to HTTPS after DNS points at Hetzner.
# Requires production DEPLOY_* secrets. Runs as tmcdeploy → sudo techmastercy-ctl.
name: Enable HTTPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable-https:
    name: Certbot + nginx HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Confirm public DNS points at Hetzner
        run: |
          set -euo pipefail
          want="46.225.180.168"
          apex="$(dig +short techmaster.com.cy A | head -n1 || true)"
          www="$(dig +short www.techmaster.com.cy A | head -n1 || true)"
          echo "apex=${apex:-none} www=${www:-none}"
          if [ "${apex}" != "${want}" ] || [ "${www}" != "${want}" ]; then
            echo "::error::DNS not ready (want ${want}). Re-check Cloudflare A records."
            exit 1
          fi

      - name: Deploy branch tip then enable HTTPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -euo pipefail
            # tmcdeploy may only sudo /usr/local/sbin/techmastercy-ctl (nothing else).
            git -C /opt/techmastercy fetch --prune origin
            BRANCH="cursor/server-access-diag-aabd"
            if git -C /opt/techmastercy rev-parse --verify "origin/${BRANCH}" >/dev/null 2>&1; then
              SHA="$(git -C /opt/techmastercy rev-parse "origin/${BRANCH}")"
            else
              SHA="$(git -C /opt/techmastercy rev-parse origin/main)"
            fi
            echo "Target SHA ${SHA}"
            sudo /usr/local/sbin/techmastercy-ctl deploy "${SHA}" || true
            sudo /usr/local/sbin/techmastercy-ctl prune || true
            sudo /usr/local/sbin/techmastercy-ctl deploy "${SHA}"
            sudo /usr/local/sbin/techmastercy-ctl enable-https techmaster.com.cy 46.225.180.168
            sudo /usr/local/sbin/techmastercy-ctl health

      - name: Probe HTTPS
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS --connect-timeout 10 --max-time 20 \
            "https://techmaster.com.cy/api/health"
          curl -fsS --connect-timeout 10 --max-time 20 \
            "https://www.techmaster.com.cy/api/health"
          echo "HTTPS OK"
