# Fix website: rename root-owned .git aside, fresh fetch, deploy, HTTPS.
name: Server access check

on:
  push:
    branches:
      - cursor/server-access-diag-aabd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-site:
    name: Fix website
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Rename root git aside, deploy, HTTPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 55m
          script: |
            set -euo pipefail
            APP=/opt/techmastercy
            CTL=/usr/local/sbin/techmastercy-ctl
            BRANCH=cursor/server-access-diag-aabd

            echo "===== before ====="
            date -u; id; df -h /
            ls -la "$APP"
            sudo -n "$CTL" help >/dev/null
            echo ctl_ok

            echo "===== move root-owned .git aside (parent is writable) ====="
            git config --global --add safe.directory "$APP"
            TS=$(date +%s)
            if [ -e "$APP/.git" ]; then
              mv "$APP/.git" "$APP/.git.root-owned.$TS"
              echo "moved .git -> .git.root-owned.$TS"
            fi
            # Move other root-owned dirs we don't need for deploy
            if [ -d "$APP/deploy.root-owned.bak" ]; then
              mv "$APP/deploy.root-owned.bak" "$APP/deploy.root-owned.bak.$TS" || true
            fi
            # Clear stale symlinks
            [ -L "$APP/deploy" ] && rm -f "$APP/deploy"
            [ -L "$APP/docker-compose.yml" ] && rm -f "$APP/docker-compose.yml"

            echo "===== fresh git checkout ====="
            git -C "$APP" init
            git -C "$APP" remote add origin https://github.com/mx95/techmastercy.git
            git -C "$APP" fetch --prune origin
            SHA=$(git -C "$APP" rev-parse "origin/${BRANCH}")
            echo "Deploying $SHA"
            git -C "$APP" checkout -f "$SHA"
            test -f "$APP/docker-compose.yml"
            test -f "$APP/deploy/techmastercy-ctl.sh"
            test -f "$APP/.env"
            ls -la "$APP" | head -n 40

            if [ -w "$APP/.env" ]; then
              if grep -q '^PAYMENT_PROVIDER=' "$APP/.env"; then
                sed -i 's|^PAYMENT_PROVIDER=.*|PAYMENT_PROVIDER="revolut_link"|' "$APP/.env"
              else
                printf '\nPAYMENT_PROVIDER="revolut_link"\n' >> "$APP/.env"
              fi
            else
              echo ".env not writable by tmcdeploy (root will keep existing values)"
            fi
            grep '^PAYMENT_PROVIDER=' "$APP/.env" || true

            echo "===== prune + deploy ====="
            sudo -n "$CTL" prune
            df -h /
            sudo -n "$CTL" deploy "$SHA"
            echo "===== https ====="
            sudo -n "$CTL" enable-https techmaster.com.cy 46.225.180.168 || true
            sudo -n "$CTL" health
            sudo -n "$CTL" status || true

            echo "===== probes ====="
            curl -fsS --max-time 10 http://127.0.0.1:3000/api/health; echo
            curl -fsS --max-time 10 http://127.0.0.1/api/health || true; echo
            curl -fsS --max-time 10 -k https://127.0.0.1/api/health || true; echo
            df -h /
            echo SITE_FIX_OK
            date -u
