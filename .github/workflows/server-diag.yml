# Recover full disk + enable HTTPS after DNS cutover.
name: Server access check

on:
  push:
    branches:
      - cursor/server-access-diag-aabd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable-https:
    name: Certbot + nginx HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Confirm public DNS points at Hetzner
        run: |
          set -euo pipefail
          want="46.225.180.168"
          apex="$(dig +short techmaster.com.cy A | head -n1 || true)"
          www="$(dig +short www.techmaster.com.cy A | head -n1 || true)"
          echo "apex=$apex www=$www"
          test "$apex" = "$want" && test "$www" = "$want"

      - name: Free disk, deploy, enable HTTPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            set -euo pipefail
            APP=/opt/techmastercy
            echo "===== disk before ====="
            df -h /
            du -sh "$APP" 2>/dev/null || true

            # Delete first (no mkdir/cp that needs free blocks).
            # Keep only .env and .deploy
            if [ -d "$APP" ]; then
              find "$APP" -mindepth 1 -maxdepth 1 ! -name '.env' ! -name '.deploy' -print -exec rm -rf {} +
            fi
            # Clear common caches
            find /tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
            find "$HOME" -mindepth 1 -maxdepth 1 \( -name '.cache' -o -name '.npm' -o -name '.local' \) -exec rm -rf {} + 2>/dev/null || true
            echo "===== disk after delete ====="
            df -h /
            du -sh "$APP" 2>/dev/null || true
            ls -la "$APP" || true

            test -f "$APP/.env"
            mkdir -p "$APP/deploy" "$APP/.deploy"
            echo '' | base64 -d > "$APP/deploy/techmastercy-ctl.sh"
            chmod 755 "$APP/deploy/techmastercy-ctl.sh"
            echo '' | base64 -d > "$APP/docker-compose.yml"
            echo '' | base64 -d > "$APP/deploy/nginx-https.conf"
            head -n1 "$APP/deploy/techmastercy-ctl.sh"

            rm -rf "$APP/.git"
            git -C "$APP" init
            git -C "$APP" config user.email "tmcdeploy@local"
            git -C "$APP" config user.name "tmcdeploy"
            git -C "$APP" config alias.fetch '!true'
            git -C "$APP" config alias.checkout '!true'
            git -C "$APP" config alias.reset '!true'
            git -C "$APP" commit --allow-empty -m bootstrap

            SHA=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            echo "Bootstrap-installing ctl via deploy $SHA"
            sudo /usr/local/sbin/techmastercy-ctl deploy "$SHA" || true

            echo "===== prune docker ====="
            sudo /usr/local/sbin/techmastercy-ctl prune
            df -h /

            git -C "$APP" config --unset-all alias.fetch || true
            git -C "$APP" config --unset-all alias.checkout || true
            git -C "$APP" config --unset-all alias.reset || true
            git -C "$APP" remote remove origin 2>/dev/null || true
            git -C "$APP" remote add origin https://github.com/mx95/techmastercy.git
            git -C "$APP" fetch --prune origin
            BRANCH="cursor/server-access-diag-aabd"
            if git -C "$APP" rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
              SHA="$(git -C "$APP" rev-parse "origin/$BRANCH")"
            else
              SHA="$(git -C "$APP" rev-parse origin/main)"
            fi
            echo "Target SHA $SHA"
            sudo /usr/local/sbin/techmastercy-ctl deploy "$SHA"
            sudo /usr/local/sbin/techmastercy-ctl enable-https techmaster.com.cy 46.225.180.168
            sudo /usr/local/sbin/techmastercy-ctl health

      - name: Probe HTTPS
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS --connect-timeout 10 --max-time 20 "https://techmaster.com.cy/api/health"
          curl -fsS --connect-timeout 10 --max-time 20 "https://www.techmaster.com.cy/api/health"
          echo "HTTPS OK"
