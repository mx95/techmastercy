# One-shot SSH connectivity check using the same secrets as Deploy production.
# Does not deploy. Does not log in as root.
name: Server access check

on:
  push:
    branches:
      - cursor/server-access-diag-aabd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-check:
    name: SSH as tmcdeploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same environment as deploy.yml so DEPLOY_* secrets resolve
    environment: production
    steps:
      - name: Probe server over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "===== identity ====="
            whoami
            hostname
            pwd
            date -u
            echo "===== app health (local) ====="
            curl -fsS --max-time 5 http://127.0.0.1:3000/api/health || echo "app:3000 unreachable"
            curl -fsS --max-time 5 http://127.0.0.1/api/health || echo "nginx:80 unreachable"
            echo "===== ctl status ====="
            sudo /usr/local/sbin/techmastercy-ctl status || true
            sudo /usr/local/sbin/techmastercy-ctl health || true
            echo "===== disk / docker ====="
            df -h / | tail -n +1
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null || echo "docker ps failed (expected if no docker group)"
            echo "===== done ====="
