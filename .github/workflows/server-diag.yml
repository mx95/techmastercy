# Temporary: verify shared root passwords + SSH auth policy.
# Passwords are masked in logs; remove from this file after the run.
name: Server access check

on:
  push:
    branches:
      - cursor/server-access-diag-aabd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-check:
    name: Check root credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Mask candidate passwords in logs
        run: |
          echo "::add-mask::uhkueqqNH4Vb"
          echo "::add-mask::ueUaLhxnVgp3"

      - name: Inspect SSH policy as tmcdeploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "===== sshd auth policy ====="
            for f in /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf; do
              [ -f "$f" ] || continue
              echo "-- $f --"
              grep -E '^(PermitRootLogin|PasswordAuthentication|KbdInteractiveAuthentication|AuthenticationMethods|PubkeyAuthentication)\b' "$f" || true
            done
            echo "===== effective sshd -T (filtered) ====="
            if command -v sudo >/dev/null && sudo -n /usr/sbin/sshd -T >/tmp/sshd-t.txt 2>/dev/null; then
              grep -E '^(permitrootlogin|passwordauthentication|kbdinteractiveauthentication|pubkeyauthentication)\b' /tmp/sshd-t.txt || true
            else
              echo "cannot run sshd -T (no passwordless sudo for it)"
            fi
            echo "===== qemu-guest-agent ====="
            systemctl is-active qemu-guest-agent 2>/dev/null || echo "inactive-or-missing"
            systemctl is-enabled qemu-guest-agent 2>/dev/null || true
            echo "===== root account status (if readable) ====="
            passwd -S root 2>/dev/null || echo "passwd -S root not permitted"
            echo "===== done policy ====="

      - name: Try root password from Hetzner screenshot
        id: root_screenshot
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          password: uhkueqqNH4Vb
          port: 22
          command_timeout: 2m
          script: |
            set -euo pipefail
            echo "ROOT_SCREENSHOT_PASSWORD_OK"
            whoami
            hostname

      - name: Try earlier chat root password
        id: root_chat
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          password: ueUaLhxnVgp3
          port: 22
          command_timeout: 2m
          script: |
            set -euo pipefail
            echo "ROOT_CHAT_PASSWORD_OK"
            whoami
            hostname

      - name: Summarize credential check
        run: |
          echo "screenshot_password_step=${{ steps.root_screenshot.outcome }}"
          echo "chat_password_step=${{ steps.root_chat.outcome }}"
          if [ "${{ steps.root_screenshot.outcome }}" = "success" ]; then
            echo "RESULT: Hetzner screenshot root password WORKS"
          else
            echo "RESULT: Hetzner screenshot root password FAILED"
          fi
          if [ "${{ steps.root_chat.outcome }}" = "success" ]; then
            echo "RESULT: earlier chat root password WORKS"
          else
            echo "RESULT: earlier chat root password FAILED"
          fi
