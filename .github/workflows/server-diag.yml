# SSH connectivity / policy check using production DEPLOY_* secrets.
# Does not deploy. Does not embed root passwords.
name: Server access check

on:
  push:
    branches:
      - cursor/server-access-diag-aabd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-check:
    name: SSH as tmcdeploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Probe server over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "===== identity ====="
            whoami
            hostname
            date -u
            echo "===== sshd files (auth-related, including comments) ====="
            for f in /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf; do
              [ -f "$f" ] || continue
              echo "-- $f --"
              grep -nEi 'permitrootlogin|passwordauthentication|kbdinteractive|pubkeyauthentication|authenticationmethods' "$f" || true
            done
            echo "===== qemu-guest-agent ====="
            systemctl is-active qemu-guest-agent 2>&1 || true
            systemctl is-enabled qemu-guest-agent 2>&1 || true
            dpkg -l qemu-guest-agent 2>/dev/null | tail -n 1 || true
            echo "===== auth.log root ssh hints (last) ====="
            if [ -r /var/log/auth.log ]; then
              grep -E 'sshd.*(root|Failed password|Invalid user)' /var/log/auth.log | tail -n 20 || true
            else
              echo "auth.log not readable by $(whoami)"
            fi
            echo "===== done ====="

  enable-https:
    name: Certbot + nginx HTTPS
    needs: ssh-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Confirm public DNS points at Hetzner
        run: |
          set -euo pipefail
          want="46.225.180.168"
          apex="$(dig +short techmaster.com.cy A | head -n1 || true)"
          www="$(dig +short www.techmaster.com.cy A | head -n1 || true)"
          echo "apex=${apex:-none} www=${www:-none}"
          if [ "${apex}" != "${want}" ] || [ "${www}" != "${want}" ]; then
            echo "::error::DNS not ready (want ${want})."
            exit 1
          fi

      - name: Deploy branch tip then enable HTTPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 35m
          script: |
            set -euo pipefail
            echo "===== disk before ====="
            df -h / /var/lib/docker 2>/dev/null || df -h /
            echo "===== ctl help (what host ctl supports) ====="
            sudo /usr/local/sbin/techmastercy-ctl help || true
            # Free anything tmcdeploy can delete before git/docker need space.
            echo "===== reclaim app-dir space ====="
            du -sh /opt/techmastercy /opt/techmastercy/.git 2>/dev/null || true
            rm -rf /opt/techmastercy/node_modules /opt/techmastercy/.next /tmp/* 2>/dev/null || true
            # Drop unreachable git objects if pack is huge (best-effort).
            git -C /opt/techmastercy gc --prune=now --aggressive 2>/dev/null || true
            # Host ctl may already have prune (after a prior refresh).
            sudo /usr/local/sbin/techmastercy-ctl prune || true
            echo "===== disk after reclaim ====="
            df -h / /var/lib/docker 2>/dev/null || df -h /
            git -C /opt/techmastercy fetch --prune origin
            BRANCH="cursor/server-access-diag-aabd"
            if git -C /opt/techmastercy rev-parse --verify "origin/${BRANCH}" >/dev/null 2>&1; then
              SHA="$(git -C /opt/techmastercy rev-parse "origin/${BRANCH}")"
            else
              SHA="$(git -C /opt/techmastercy rev-parse origin/main)"
            fi
            echo "Target SHA ${SHA}"
            sudo /usr/local/sbin/techmastercy-ctl deploy "${SHA}" || true
            sudo /usr/local/sbin/techmastercy-ctl prune || true
            sudo /usr/local/sbin/techmastercy-ctl deploy "${SHA}"
            sudo /usr/local/sbin/techmastercy-ctl enable-https techmaster.com.cy 46.225.180.168
            sudo /usr/local/sbin/techmastercy-ctl health

      - name: Probe HTTPS
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS --connect-timeout 10 --max-time 20 \
            "https://techmaster.com.cy/api/health"
          curl -fsS --connect-timeout 10 --max-time 20 \
            "https://www.techmaster.com.cy/api/health"
          echo "HTTPS OK"
