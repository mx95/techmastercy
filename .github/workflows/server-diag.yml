# Try root key auth to prune Docker + restore ctl (console not required).
name: Server access check

on:
  push:
    branches:
      - cursor/server-access-diag-aabd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-as-root:
    name: Prune as root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Try SSH as root with deploy key
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        continue-on-error: true
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -euo pipefail
            echo "===== root session OK ====="
            whoami
            df -h /
            docker system prune -af
            curl -fsSL https://raw.githubusercontent.com/mx95/techmastercy/cursor/server-access-diag-aabd/deploy/techmastercy-ctl.sh \
              -o /usr/local/sbin/techmastercy-ctl
            chmod 750 /usr/local/sbin/techmastercy-ctl
            head -n 2 /usr/local/sbin/techmastercy-ctl
            df -h /
            # Restore app checkout + deploy
            cd /opt/techmastercy
            if [ ! -d .git ] || [ ! -f docker-compose.yml ]; then
              rm -rf .git deploy docker-compose.yml 2>/dev/null || true
              git init
              git remote add origin https://github.com/mx95/techmastercy.git || \
                git remote set-url origin https://github.com/mx95/techmastercy.git
            fi
            git fetch --prune origin
            SHA=$(git rev-parse origin/cursor/server-access-diag-aabd)
            echo "Deploying $SHA"
            /usr/local/sbin/techmastercy-ctl deploy "$SHA"
            /usr/local/sbin/techmastercy-ctl enable-https techmaster.com.cy 46.225.180.168
            /usr/local/sbin/techmastercy-ctl health

      - name: Fallback SSH as tmcdeploy (diagnose)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            df -h /
            ls -la /usr/local/sbin/techmastercy-ctl
            wc -c /usr/local/sbin/techmastercy-ctl || true
            curl -sS -o /dev/null -w "health_http=%{http_code}\n" --connect-timeout 5 http://127.0.0.1:3000/api/health || true

      - name: Probe public site
        run: |
          set -euo pipefail
          sleep 2
          curl -fsS --connect-timeout 10 --max-time 20 "http://techmaster.com.cy/api/health" || true
          curl -fsS --connect-timeout 10 --max-time 20 "https://techmaster.com.cy/api/health" || true
