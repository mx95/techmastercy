# Recover full VPS disk then redeploy + HTTPS.
name: Server access check

on:
  push:
    branches:
      - cursor/server-access-diag-aabd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Prune Docker + HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Prune and restore site
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            set -euo pipefail
            echo "===== before ====="
            df -h / /dev/shm 2>/dev/null || df -h /
            id
            ls -la /opt/techmastercy /opt/techmastercy/deploy 2>/dev/null || true
            sudo /usr/local/sbin/techmastercy-ctl help || true

            APP=/opt/techmastercy
            SHM=/dev/shm/tmc-recover
            mkdir -p "$SHM"

            # Stage new ctl on tmpfs (works even when / is full for non-root).
            curl -fsSL "https://raw.githubusercontent.com/mx95/techmastercy/cursor/server-access-diag-aabd/deploy/techmastercy-ctl.sh" \
              -o "$SHM/techmastercy-ctl.sh"
            curl -fsSL "https://raw.githubusercontent.com/mx95/techmastercy/cursor/server-access-diag-aabd/docker-compose.yml" \
              -o "$SHM/docker-compose.yml"
            curl -fsSL "https://raw.githubusercontent.com/mx95/techmastercy/cursor/server-access-diag-aabd/deploy/nginx-https.conf" \
              -o "$SHM/nginx-https.conf"
            chmod 755 "$SHM/techmastercy-ctl.sh"
            head -n1 "$SHM/techmastercy-ctl.sh"

            # Move aside root-owned deploy dir (parent is 777 / owned by tmcdeploy).
            if [ -d "$APP/deploy" ]; then
              mv "$APP/deploy" "$APP/deploy.bak.$$" 2>/dev/null || true
            fi
            # Symlink deploy → tmpfs so root ctl install reads our new script.
            ln -sfn "$SHM" "$APP/deploy"
            # Compose file on disk path ctl expects
            if [ ! -f "$APP/docker-compose.yml" ]; then
              ln -sfn "$SHM/docker-compose.yml" "$APP/docker-compose.yml"
            fi
            # nginx conf where enable-https looks
            ln -sfn "$SHM/nginx-https.conf" "$SHM/nginx-https.conf" 2>/dev/null || true
            # ensure enable-https path APP/deploy/nginx-https.conf resolves via SHM
            test -f "$APP/deploy/techmastercy-ctl.sh"
            test -f "$APP/deploy/nginx-https.conf" || ln -sfn "$SHM/nginx-https.conf" "$APP/deploy/nginx-https.conf"

            # Git no-op aliases so deploy refreshes ctl without writing objects on /
            if [ ! -d "$APP/.git" ]; then
              # init on tmpfs and symlink? git needs .git on APP — put .git on shm
              rm -rf "$SHM/git"
              mkdir -p "$SHM/git"
              git -C "$SHM/git" init
              git -C "$SHM/git" config user.email t@local
              git -C "$SHM/git" config user.name t
              git -C "$SHM/git" commit --allow-empty -m b
              ln -sfn "$SHM/git/.git" "$APP/.git"
            fi
            git -C "$APP" config alias.fetch '!true'
            git -C "$APP" config alias.checkout '!true'
            git -C "$APP" config alias.reset '!true'

            SHA=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            echo "Self-refresh ctl via deploy $SHA"
            sudo /usr/local/sbin/techmastercy-ctl deploy "$SHA" || true

            echo "===== prune ====="
            sudo /usr/local/sbin/techmastercy-ctl help
            sudo /usr/local/sbin/techmastercy-ctl prune
            df -h /

            # Real fetch/deploy from GitHub
            git -C "$APP" config --unset-all alias.fetch || true
            git -C "$APP" config --unset-all alias.checkout || true
            git -C "$APP" config --unset-all alias.reset || true
            # Replace shm .git with real repo on disk now that space exists
            rm -f "$APP/.git"
            rm -rf "$APP/deploy" "$APP/docker-compose.yml"
            git -C "$APP" init
            git -C "$APP" remote add origin https://github.com/mx95/techmastercy.git
            git -C "$APP" fetch --prune origin
            SHA="$(git -C "$APP" rev-parse origin/cursor/server-access-diag-aabd)"
            echo "Deploy $SHA"
            sudo /usr/local/sbin/techmastercy-ctl deploy "$SHA"
            sudo /usr/local/sbin/techmastercy-ctl enable-https techmaster.com.cy 46.225.180.168
            sudo /usr/local/sbin/techmastercy-ctl health

      - name: Probe site
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS --connect-timeout 10 --max-time 20 "http://techmaster.com.cy/api/health"
          curl -fsS --connect-timeout 10 --max-time 20 "https://techmaster.com.cy/api/health"
          echo OK
