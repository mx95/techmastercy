# Post-recover verification: disk, ctl, deploy, HTTPS, health.
name: Server access check

on:
  push:
    branches:
      - cursor/server-access-diag-aabd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify + finish deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Disk, ctl, deploy, HTTPS, health
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            set -euo pipefail
            APP=/opt/techmastercy
            CTL=/usr/local/sbin/techmastercy-ctl
            BRANCH=cursor/server-access-diag-aabd

            echo "===== disk / ctl ====="
            df -h /
            ls -la "$CTL"
            sudo -n wc -c "$CTL"
            sudo -n "$CTL" help | head -n 40

            echo "===== ensure checkout ====="
            mkdir -p "$APP"
            if [ ! -d "$APP/.git" ]; then
              git -C "$APP" init
              git -C "$APP" remote add origin https://github.com/mx95/techmastercy.git 2>/dev/null \
                || git -C "$APP" remote set-url origin https://github.com/mx95/techmastercy.git
            fi
            # Drop tmpfs symlinks from recovery staging if present
            if [ -L "$APP/deploy" ]; then rm -f "$APP/deploy"; fi
            if [ -L "$APP/docker-compose.yml" ]; then rm -f "$APP/docker-compose.yml"; fi
            git -C "$APP" fetch --prune origin
            SHA=$(git -C "$APP" rev-parse "origin/${BRANCH}")
            echo "Deploying $SHA"

            echo "===== prune (safe) + deploy ====="
            sudo -n "$CTL" prune || true
            df -h /
            sudo -n "$CTL" deploy "$SHA"
            sudo -n "$CTL" enable-https techmaster.com.cy 46.225.180.168 || true
            sudo -n "$CTL" health
            sudo -n "$CTL" status || true

            echo "===== local probes ====="
            curl -fsS --max-time 5 http://127.0.0.1:3000/api/health || true
            curl -fsS --max-time 5 -k https://127.0.0.1/api/health || true
            curl -fsS --max-time 5 http://127.0.0.1/api/health || true
            df -h /
            echo "===== done ====="
