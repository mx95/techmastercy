# SSH connectivity / policy check using production DEPLOY_* secrets.
# Does not deploy. Does not embed root passwords.
name: Server access check

on:
  push:
    branches:
      - cursor/server-access-diag-aabd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-check:
    name: SSH as tmcdeploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Probe server over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "===== identity ====="
            whoami
            hostname
            date -u
            echo "===== sshd files (auth-related, including comments) ====="
            for f in /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf; do
              [ -f "$f" ] || continue
              echo "-- $f --"
              grep -nEi 'permitrootlogin|passwordauthentication|kbdinteractive|pubkeyauthentication|authenticationmethods' "$f" || true
            done
            echo "===== qemu-guest-agent ====="
            systemctl is-active qemu-guest-agent 2>&1 || true
            systemctl is-enabled qemu-guest-agent 2>&1 || true
            dpkg -l qemu-guest-agent 2>/dev/null | tail -n 1 || true
            echo "===== auth.log root ssh hints (last) ====="
            if [ -r /var/log/auth.log ]; then
              grep -E 'sshd.*(root|Failed password|Invalid user)' /var/log/auth.log | tail -n 20 || true
            else
              echo "auth.log not readable by $(whoami)"
            fi
            echo "===== done ====="
