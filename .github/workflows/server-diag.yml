# SSH connectivity / policy check using production DEPLOY_* secrets.
# Also used to recover disk + enable HTTPS after DNS cutover.
name: Server access check

on:
  push:
    branches:
      - cursor/server-access-diag-aabd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-check:
    name: SSH as tmcdeploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Probe server over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            whoami
            df -h /

  enable-https:
    name: Certbot + nginx HTTPS
    needs: ssh-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Confirm public DNS points at Hetzner
        run: |
          set -euo pipefail
          want="46.225.180.168"
          apex="$(dig +short techmaster.com.cy A | head -n1 || true)"
          www="$(dig +short www.techmaster.com.cy A | head -n1 || true)"
          echo "apex=$apex www=$www"
          if [ "$apex" != "$want" ] || [ "$www" != "$want" ]; then
            echo "::error::DNS not ready (want $want)."
            exit 1
          fi

      - name: Free disk, deploy, enable HTTPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            set -euo pipefail
            echo "===== disk before ====="
            df -h /
            APP=/opt/techmastercy

            # Free every byte tmcdeploy can delete (disk is 100% full).
            rm -rf /tmp/* /var/tmp/* "$HOME/.cache" "$HOME/.npm" 2>/dev/null || true
            # Keep .git/config for aliases; drop object packs/loose objects.
            if [ -d "$APP/.git" ]; then
              git -C "$APP" config alias.fetch '!true' || true
              git -C "$APP" config alias.checkout '!true' || true
              git -C "$APP" config alias.reset '!true' || true
              find "$APP/.git/objects" -type f -delete 2>/dev/null || true
              find "$APP/.git/objects/pack" -type f -delete 2>/dev/null || true
              rm -rf "$APP/.git/objects/pack" "$APP/.git/modules" "$APP/.git/lfs" 2>/dev/null || true
            fi
            rm -rf "$APP/node_modules" "$APP/.next" 2>/dev/null || true
            # Truncate any huge logs we can write
            find /var/log -type f -name '*.log' -writable -exec truncate -s 0 {} \; 2>/dev/null || true
            df -h /

            mkdir -p "$APP/deploy"
            echo '' | base64 -d > "$APP/deploy/techmastercy-ctl.sh"
            chmod 755 "$APP/deploy/techmastercy-ctl.sh"
            head -n1 "$APP/deploy/techmastercy-ctl.sh"

            # Ensure aliases exist even if .git was partially wiped
            mkdir -p "$APP/.git"
            git -C "$APP" config alias.fetch '!true'
            git -C "$APP" config alias.checkout '!true'
            git -C "$APP" config alias.reset '!true'

            SHA=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            echo "Bootstrap-installing ctl via deploy $SHA (git no-op aliases)"
            sudo /usr/local/sbin/techmastercy-ctl deploy "$SHA" || true

            echo "===== prune docker ====="
            sudo /usr/local/sbin/techmastercy-ctl prune
            df -h /

            git -C "$APP" config --unset-all alias.fetch || true
            git -C "$APP" config --unset-all alias.checkout || true
            git -C "$APP" config --unset-all alias.reset || true

            # Re-init remote tracking if objects were wiped
            if ! git -C "$APP" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git -C "$APP" init
              git -C "$APP" remote add origin https://github.com/mx95/techmastercy.git || true
            fi
            git -C "$APP" remote set-url origin https://github.com/mx95/techmastercy.git || true
            git -C "$APP" fetch --prune origin
            BRANCH="cursor/server-access-diag-aabd"
            if git -C "$APP" rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
              SHA="$(git -C "$APP" rev-parse "origin/$BRANCH")"
            else
              SHA="$(git -C "$APP" rev-parse origin/main)"
            fi
            echo "Target SHA $SHA"
            git -C "$APP" show "origin/$BRANCH:deploy/nginx-https.conf" > "$APP/deploy/nginx-https.conf" || true
            sudo /usr/local/sbin/techmastercy-ctl deploy "$SHA"
            sudo /usr/local/sbin/techmastercy-ctl enable-https techmaster.com.cy 46.225.180.168
            sudo /usr/local/sbin/techmastercy-ctl health

      - name: Probe HTTPS
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS --connect-timeout 10 --max-time 20 "https://techmaster.com.cy/api/health"
          curl -fsS --connect-timeout 10 --max-time 20 "https://www.techmaster.com.cy/api/health"
          echo "HTTPS OK"
