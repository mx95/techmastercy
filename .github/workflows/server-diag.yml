# SSH connectivity check. HTTPS enablement is manual after disk is healthy:
#   sudo /usr/local/sbin/techmastercy-ctl prune
#   sudo /usr/local/sbin/techmastercy-ctl deploy <sha>
#   sudo /usr/local/sbin/techmastercy-ctl enable-https
name: Server access check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-check:
    name: SSH as tmcdeploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Probe server over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            whoami
            hostname
            df -h /
            sudo /usr/local/sbin/techmastercy-ctl help || true
            sudo /usr/local/sbin/techmastercy-ctl status || true
