# HTTPS reverse proxy for TechmasterCY.
# Enable ONLY after:
#   1) DNS A/AAAA for techmaster.com.cy points to this server
#   2) Certificates have been issued successfully with Certbot
#
# Do not enable the HTTP→HTTPS redirect until certificates exist.

upstream techmastercy_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name techmaster.com.cy www.techmaster.com.cy;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name techmaster.com.cy www.techmaster.com.cy;

    ssl_certificate     /etc/letsencrypt/live/techmaster.com.cy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techmaster.com.cy/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://techmastercy_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
